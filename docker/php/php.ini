; Réglages PHP communs à tous les environnements StockFlow.
date.timezone = Africa/Abidjan
expose_php = Off
memory_limit = 256M

; Les traces d'exception ne contiennent pas les arguments des fonctions : un mot de passe
; ou une donnée personnelle passée en argument ne finit pas dans storage/logs.
zend.exception_ignore_args = On

; Images de produits : 2 Mo au plus côté application, marge pour le reste du formulaire.
upload_max_filesize = 4M
post_max_size = 8M

; Cookies de session : Laravel les règle aussi, ceci couvre tout script hors framework.
session.cookie_httponly = On
session.use_strict_mode = On
