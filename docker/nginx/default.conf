server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 8m;
    server_tokens off;

    # En-têtes de sécurité sur toutes les réponses, y compris les fichiers statiques et les
    # erreurs servies par Nginx. Laravel pose les mêmes (App\Http\Middleware\SecurityHeaders) :
    # ceux de PHP sont masqués plus bas pour qu'aucun en-tête n'apparaisse deux fois.
    # Les autres en-têtes de Laravel (Content-Security-Policy, Permissions-Policy, HSTS)
    # passent tels quels.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Les images des produits ne sont pas servies par Nginx : elles sont sur le disque privé
    # et passent par une route Laravel réservée aux utilisateurs connectés.

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Referrer-Policy;
    }

    # Aucun autre fichier PHP n'est exécutable depuis le web.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
