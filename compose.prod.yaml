# Production de StockFlow : un serveur, trois conteneurs.
#
#   scripts/deploy.sh            (procédure complète, voir docs/07-deployment/deployment.md)
#
# Le TLS (HTTPS) est assuré en amont par un proxy inverse qui transmet les en-têtes
# X-Forwarded-*. Le service "web" n'écoute que sur 127.0.0.1 : seul ce proxy l'atteint.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    image: stockflow-app:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env.production
    volumes:
      # Images des produits et journaux : hors de l'image, conservés d'un déploiement à l'autre.
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy

  web:
    # Nginx avec les fichiers publics et les CSS et JS compilés de la même version que le code.
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: stockflow-web:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      - app

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Africa/Abidjan
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # Aucun port publié : MySQL n'est joignable que par les conteneurs de l'application.
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  dbdata:
  storage:
  logs:
