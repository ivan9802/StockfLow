# Production de StockFlow : un serveur, trois conteneurs.
#
#   docker compose -f compose.prod.yaml --env-file .env.production up -d --build
#
# Le TLS (HTTPS) est assuré en amont par un proxy inverse ou un équilibreur de charge
# (voir docs/07-deployment/deployment.md). Le service "web" n'écoute que sur 127.0.0.1.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    image: stockflow-app:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env.production
    volumes:
      # Images des produits, journaux : hors de l'image, conservés d'un déploiement à l'autre.
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
      - public_build:/var/www/html/public/build
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_build:/var/www/html/public/build:ro
      - ./public/favicon.svg:/var/www/html/public/favicon.svg:ro
      - ./public/robots.txt:/var/www/html/public/robots.txt:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Africa/Abidjan
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  dbdata:
  storage:
  logs:
  public_build:
